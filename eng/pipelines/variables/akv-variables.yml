variables:
    - group: 'AKV Variables (v2)'
      # AKVMajor
      # AKVMinor
      # AKVPatch
      # AKVRevision
      # BuildRemarkPre
      # BuildRemarkProd
      # Major
      # Minor
      # PAT_AKV
      # Patch
      # Preview
      # Revision

    - name: AKVNugetPackageVersion
      value: '$(AKVMajor).$(AKVMinor).$(AKVPatch)'
    - name: AKVAssemblyFileVersion
      value: '$(AKVMajor).$(AKVMinor)$(AKVPatch).$(Build.BuildNumber)'

    # @TODO: Should remove in favor of fixed location in project folder
    - name: akvNuspecPath
      value: '$(REPOROOT)/tools/specs/add-ons/Microsoft.Data.SqlClient.AlwaysEncrypted.AzureKeyVaultProvider.nuspec'
